<div [class.card-header--mobile-compact]="mobileCompact" class="card-header d-flex justify-content-between align-items-center flex-wrap p-16 w-100">
    <div class="card-header__context">
        <div role="heading" aria-level="2" class="f-s-20 f-w-600 text-primary-dark">
            {{ titulo }}
        </div>
        <div class="f-s-13 text-muted" [class.card-header__subtitle--semantic]="titleOnly" *ngIf="subtitulo">
            {{ subtitulo }}
        </div>
    </div>

    <ng-container *ngIf="!titleOnly" [ngTemplateOutlet]="headerActions"></ng-container>

</div>

<mat-divider *ngIf="mostrarDivisor" class="m-b-24"></mat-divider>

@if (titleOnly) {
  <div class="card-header__mobile-actions">
    <ng-container [ngTemplateOutlet]="headerActions"></ng-container>
  </div>
}
<ng-template #headerActions>
    <div class="card-header__actions d-flex align-items-center gap-8 flex-wrap">
        <!-- Botão de ajuda -->
        <ng-container *ngIf="helpRota">
            <ng-container *ngIf="helpExterno; else helpInterno">
                <a
                  mat-icon-button
                  class="help-icon-btn"
                  [href]="helpRota"
                  target="_blank"
                  rel="noopener"
                  [matTooltip]="helpTexto || 'Ajuda'"
                  [attr.aria-label]="helpTexto || 'Ajuda'"
                >
                    <mat-icon>{{ helpIcone }}</mat-icon>
                </a>
            </ng-container>
            <ng-template #helpInterno>
                <a
                  mat-icon-button
                  class="help-icon-btn"
                  [routerLink]="helpRota"
                  [fragment]="helpFragment"
                  [matTooltip]="helpTexto || 'Ajuda'"
                  [attr.aria-label]="helpTexto || 'Ajuda'"
                >
                    <mat-icon>{{ helpIcone }}</mat-icon>
                </a>
            </ng-template>
        </ng-container>
        <ng-content></ng-content>

        <!-- Botão de ação -->
        <ng-container *ngIf="botaoTexto && botaoRota">
            <ng-container *ngIf="!permissao; else botaoComPermissao">
                <button type="button" [disabled]="actionDisabled || actionPending" [attr.aria-busy]="actionPending" mat-stroked-button [color]="botaoCor" [routerLink]="botaoRota">
                    <mat-icon class="m-r-4">{{ botaoIcone }}</mat-icon>
                    {{ actionPending ? actionPendingText : botaoTexto }}
                </button>
            </ng-container>

            <ng-template #botaoComPermissao>
                <button type="button" [disabled]="actionDisabled || actionPending" [attr.aria-busy]="actionPending" mat-stroked-button [color]="botaoCor" [routerLink]="botaoRota" *temPermissao="permissao">
                    <mat-icon class="m-r-4">{{ botaoIcone }}</mat-icon>
                    {{ actionPending ? actionPendingText : botaoTexto }}
                </button>
            </ng-template>
        </ng-container>
        @if (primaryAction; as action) {
          @if (action.permission) {
            <ng-container *temPermissao="action.permission"><ng-container [ngTemplateOutlet]="declaredPrimaryAction"></ng-container></ng-container>
          } @else {
            <ng-container [ngTemplateOutlet]="declaredPrimaryAction"></ng-container>
          }
        }
    </div>
</ng-template>
<ng-template #declaredPrimaryAction>
  <button class="card-header__primary-action" mat-flat-button [color]="primaryAction!.color || 'primary'" type="button"
    [disabled]="actionDisabled || actionPending || primaryAction!.disabled"
    [appTutorialTarget]="primaryAction!.tutorialTarget || ''" (click)="onPrimaryAction()">
    <mat-icon>{{ primaryAction!.icon || 'add' }}</mat-icon>{{ primaryAction!.label }}
  </button>
</ng-template>

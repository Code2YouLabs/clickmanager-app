@if (panelEditor) {
  <section class="mobile-side-panel__layout observacoes-panel">
    <header class="mobile-side-panel__header observacoes-panel__header">
      <h2 mat-dialog-title>{{ titulo }}</h2>
      <button mat-icon-button type="button" [attr.aria-label]="'Fechar ' + titulo" [disabled]="salvando" (click)="fecharEditor.emit()"><mat-icon>close</mat-icon></button>
    </header>
    <mat-dialog-content class="mobile-side-panel__body" [attr.aria-busy]="salvando">
      <app-input-textarea [control]="control" [label]="label" [rows]="10" [placeholder]="placeholder" [readonly]="inativo || salvando"></app-input-textarea>
    </mat-dialog-content>
    <mat-dialog-actions class="mobile-side-panel__footer">
      <button mat-stroked-button type="button" [disabled]="salvando" (click)="fecharEditor.emit()">{{ inativo ? 'Fechar' : 'Cancelar' }}</button>
      <button class="apply-observation" *ngIf="!inativo" mat-flat-button color="primary" type="button" [disabled]="salvando || control.invalid || control.pending" (click)="aplicarEdicao()">{{ salvando ? 'Aplicando...' : 'Aplicar observação' }}</button>
    </mat-dialog-actions>
  </section>
} @else {
<ng-container *ngIf="renderCard; else content">
  <app-section-card [titulo]="titulo" [divider]="divider" [mobilePlain]="mobileCompact">
    <ng-container [ngTemplateOutlet]="content"></ng-container>
  </app-section-card>
</ng-container>

<ng-template #content>
  <div class="obs-block" [class.border]="!renderCard" [class.inativo]="inativo">
    <div class="empty-alert" *ngIf="!textoSalvo && !editando && !mobileCompact">
      <mat-icon>info</mat-icon>
      <span>{{ emptyMessage }}</span>
    </div>

    <ng-container *ngIf="editando; else viewMode">
      <app-input-textarea
        [control]="control"
        [label]="''"
        [rows]="3"
        [placeholder]="placeholder">
      </app-input-textarea>

      <div class="obs-actions">
        <button mat-flat-button color="primary" type="button" (click)="onSalvar()" [disabled]="salvando || !hasTexto || inativo">
          Salvar observação
        </button>
        <button mat-stroked-button type="button" *ngIf="textoSalvo" (click)="cancelar()" [disabled]="salvando || inativo">
          Cancelar
        </button>
      </div>
    </ng-container>

    <ng-template #viewMode>
      <ng-container *ngIf="textoSalvo; else addAction">
        <textarea class="readonly-text" readonly [value]="textoSalvo"></textarea>
        <div class="obs-actions">
          <button mat-stroked-button color="primary" type="button" (click)="editar()" [disabled]="inativo">
            Editar observação
          </button>
        </div>
      </ng-container>
      <ng-template #addAction>
        <div class="empty-actions">
          <button mat-flat-button color="primary" type="button" (click)="iniciarEdicao()" [disabled]="inativo">
            Adicionar observação
          </button>
        </div>
      </ng-template>
    </ng-template>
  </div>
</ng-template>

}

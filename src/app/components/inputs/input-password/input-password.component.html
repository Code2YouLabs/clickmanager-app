<div class="form-group">
  <mat-label class="f-s-14 f-w-600 m-b-8 d-block">{{ label }}</mat-label>
  <mat-form-field appearance="outline" class="w-100">
    <input matInput [formControl]="control" [type]="hide ? 'password' : 'text'"
      [placeholder]="placeholder" [attr.aria-label]="label" [required]="isRequired"
      [attr.autocomplete]="autocomplete" (blur)="control.markAsTouched()" />
    <button mat-icon-button matSuffix type="button" [disabled]="control.disabled" (click)="hide = !hide"
      [attr.aria-label]="hide ? 'Mostrar senha' : 'Ocultar senha'" [attr.aria-pressed]="!hide">
      <mat-icon class="op-5">{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
    </button>
    <mat-error *ngIf="control.invalid && control.touched">{{ errorMessage() }}</mat-error>
  </mat-form-field>
</div>

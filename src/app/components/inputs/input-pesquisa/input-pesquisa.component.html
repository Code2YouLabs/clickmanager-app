<div class="w-100">
  <mat-label *ngIf="showLabel && !compact" class="f-s-14 f-w-600 d-block m-b-8 m-t-16">Pesquisar:</mat-label>
  <mat-form-field (pointerdown)="focusFromPointer($event)" appearance="outline" class="w-100" [class.hide-hint]="compact">
    <mat-label *ngIf="compact">{{ placeholder }}</mat-label>
    <mat-icon *ngIf="compact || isMobile()" matPrefix>search</mat-icon>
    <input #searchInput matInput type="search"
      [attr.inputmode]="isMobile() ? 'text' : null" [attr.enterkeyhint]="isMobile() ? 'search' : null"
      [attr.autocomplete]="isMobile() ? 'off' : null" [placeholder]="placeholder" [attr.aria-label]="placeholder" [formControl]="pesquisaControl" />
  </mat-form-field>
</div>

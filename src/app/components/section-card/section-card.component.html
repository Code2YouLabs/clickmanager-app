<mat-card class="section-card cardWithShadow" [class.section-card--mobile-plain]="mobilePlain" [class.section-card--fixed-height]="fixedHeight">
  <div class="section-card__header" [class.section-card__header--collapsible]="collapsible">
    @if (collapsible) {
      <button type="button" class="section-card__toggle" [attr.aria-expanded]="mobileExpanded" [attr.aria-controls]="bodyId" (click)="toggle()">
        <span><strong>{{ displayTitle }}</strong><small *ngIf="mobileSummary">{{ mobileSummary }}</small></span>
        <mat-icon aria-hidden="true">{{ mobileExpanded ? 'expand_less' : 'expand_more' }}</mat-icon>
      </button>
    }
    <div class="section-card__title" *ngIf="!collapsible">
      <div class="title" *ngIf="displayTitle">{{ displayTitle }}</div>
      <div class="subtitle" *ngIf="displaySubtitle">{{ displaySubtitle }}</div>
    </div>
    <div class="section-card__actions">
      <ng-content select="[section-card-actions]"></ng-content>
      <ng-content select="[actions]"></ng-content>
    </div>
  </div>

  <ng-container *ngIf="showDivider && (!collapsible || mobileExpanded)">
    <mat-divider class="m-b-12"></mat-divider>
  </ng-container>

  <div class="section-card__body" [id]="bodyId" [hidden]="collapsible && !mobileExpanded" [attr.inert]="collapsible && !mobileExpanded ? '' : null">
    <ng-content></ng-content>
  </div>
</mat-card>

<mat-card class="section-card cardWithShadow">
  <div class="section-card__header">
    <div class="section-card__title">
      <div class="title" *ngIf="displayTitle">{{ displayTitle }}</div>
      <div class="subtitle" *ngIf="displaySubtitle">{{ displaySubtitle }}</div>
    </div>
    <div class="section-card__actions">
      <ng-content select="[section-card-actions]"></ng-content>
      <ng-content select="[actions]"></ng-content>
    </div>
  </div>

  <ng-container *ngIf="showDivider">
    <mat-divider class="m-b-12"></mat-divider>
  </ng-container>

  <div class="section-card__body">
    <ng-content></ng-content>
  </div>
</mat-card>

<div class="price-selector-shell">
  <section class="price-selector-section price-selector-section--type">
    <ng-container *ngIf="formGroup.get('tipo') as tipoCtrl">
      <app-input-options
        [control]="getControl('tipo')"
        label="Tipo de Preço"
        [options]="tiposPrecoOptions"
        labelKey="label"
        valueKey="value"
        [showNull]="false" />
    </ng-container>
  </section>

    <!-- Preço Fixo -->
    <div class="price-selector-mode" *ngIf="formGroup.get('tipo')?.value === 'FIXO'">
      <div class="price-selector-mode__content">
        <div class="metro-price-grid metro-price-grid--single">
          <section class="price-selector-section metro-price-group">
            <div class="metro-price-group__title">Valores</div>
            <div class="metro-price-group__grid metro-price-group__grid--single">
              <div class="metro-price-control">
                <ng-container *ngIf="formGroup.get('valor') as valorCtrl">
                  <app-input-moeda [control]="getControl('valor')" label="Valor" placeholder="Valor" />
                </ng-container>
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>

    <!-- Preço por Quantidade -->
    <div class="price-selector-mode" *ngIf="formGroup.get('tipo')?.value === 'QUANTIDADE' && formGroup.get('faixas')">
      <div class="price-selector-mode__content">
        <section class="price-selector-section metro-price-group">
          <div class="metro-price-group__title">Faixas de preço</div>
          <div [formGroup]="formGroup">
            <div formArrayName="faixas">
              <div *ngFor="let grupo of faixas.controls; let i = index" [formGroupName]="i" class="price-range-row">
                <div class="metro-price-group__grid price-range-grid">
                  <div class="metro-price-control">
                    <ng-container *ngIf="grupo.get('quantidade') as qtdCtrl">
                      <app-input-numerico [control]="getControlDoGrupo(grupo, 'quantidade')"
                        [label]="'Quantidade ' + (i + 1)" placeholder="Quantidade" />
                    </ng-container>
                  </div>
                  <div class="metro-price-control price-range-control-with-action">
                    <div class="price-range-control-with-action__input">
                      <ng-container *ngIf="grupo.get('valor') as valorFaixaCtrl">
                        <app-input-moeda [control]="getControlDoGrupo(grupo, 'valor')" [label]="'Valor ' + (i + 1)"
                          placeholder="Preço" />
                      </ng-container>
                    </div>
                    <button type="button" mat-icon-button color="warn" *ngIf="faixas.length > 1"
                      (click)="removerFaixa(i)" matTooltip="Remover faixa">
                      <mat-icon>delete</mat-icon>
                    </button>
                  </div>
                </div>

                <div *ngIf="i < faixas.length - 1" class="price-range-divider"></div>
              </div>
            </div>
          </div>

          <button type="button" mat-stroked-button color="primary" class="price-range-add" (click)="adicionarFaixaPorTipo()">
            <mat-icon class="me-1">add</mat-icon> Adicionar Faixa
          </button>
        </section>

      </div>
    </div>

    <!-- Preço por Metro -->
    <div class="price-selector-mode" *ngIf="formGroup.get('tipo')?.value === 'METRO'">
      <div class="price-selector-mode__content">
        <div class="metro-price-grid">
          <section class="price-selector-section metro-price-group">
            <div class="metro-price-group__title">Cobrança e unidade</div>
            <div class="metro-price-group__grid">
              <div class="metro-price-control metro-price-control--charge">
                <label class="metro-price-label">Modo de Cobrança</label>
                <ng-container *ngIf="formGroup.get('modoCobranca') as modoCtrl">
                  <mat-button-toggle-group
                    class="metro-price-toggle w-100"
                    [formControl]="getControl('modoCobranca')"
                    aria-label="Modo de cobrança">
                    <mat-button-toggle value="QUADRADO">Quadrado</mat-button-toggle>
                    <mat-button-toggle value="LINEAR">Linear</mat-button-toggle>
                  </mat-button-toggle-group>
                </ng-container>
              </div>

              <div class="metro-price-control">
                <ng-container *ngIf="formGroup.get('unidadeDimensao') as unidadeCtrl">
                  <app-input-unidade-medida
                    [control]="getControl('unidadeDimensao')"
                    [options]="unidadesDimensao"
                    label="Unidade de Medida" />
                </ng-container>
              </div>
            </div>
          </section>

          <section class="price-selector-section metro-price-group">
            <div class="metro-price-group__title">Valores</div>
            <div class="metro-price-group__grid">
              <div class="metro-price-control">
                <ng-container *ngIf="formGroup.get('precoMetro') as precoMetroCtrl">
                  <app-input-moeda [control]="getControl('precoMetro')" label="Preço por metro" placeholder="Preço" />
                </ng-container>
              </div>

              <div class="metro-price-control">
                <ng-container *ngIf="formGroup.get('precoMinimo') as precoMinCtrl">
                  <app-input-moeda [control]="getControl('precoMinimo')" label="Preço Mínimo"
                    placeholder="Valor mínimo por item" />
                </ng-container>
              </div>
            </div>
          </section>

          <section class="price-selector-section metro-price-group" *ngIf="modoCobrancaMetro !== 'LINEAR'">
            <div class="metro-price-group__title">Limites máximos</div>
            <div class="metro-price-group__grid">
              <div class="metro-price-control">
                <ng-container *ngIf="formGroup.get('larguraMaxima') as larguraCtrl">
                  <app-input-numerico [control]="getControl('larguraMaxima')" [label]="'Largura Máxima (' + unidadeDimensaoSimbolo + ')'"
                    placeholder="0 para sem limite" />
                </ng-container>
              </div>

              <div class="metro-price-control">
                <ng-container *ngIf="formGroup.get('alturaMaxima') as alturaCtrl">
                  <app-input-numerico [control]="getControl('alturaMaxima')" [label]="'Altura Máxima (' + unidadeDimensaoSimbolo + ')'"
                    placeholder="0 para sem limite" />
                </ng-container>
              </div>
            </div>
          </section>

          <section class="price-selector-section metro-price-group" *ngIf="modoCobrancaMetro === 'LINEAR'">
            <div class="metro-price-group__title">Larguras lineares</div>
            <div class="metro-price-group__grid">
              <div class="metro-price-control">
                <ng-container *ngIf="formGroup.get('largurasLinearesPermitidas') as largurasCtrl">
                  <app-input-texto-restrito [control]="getControl('largurasLinearesPermitidas')"
                    [label]="'Larguras (' + unidadeDimensaoSimbolo + ')'" placeholder="Ex: 20, 30, 50" />
                </ng-container>
              </div>
              <div class="metro-price-control">
                <ng-container *ngIf="formGroup.get('alturaMaxima') as alturaCtrl">
                  <app-input-numerico [control]="getControl('alturaMaxima')" [label]="'Altura Máxima (' + unidadeDimensaoSimbolo + ')'"
                    placeholder="0 para sem limite" />
                </ng-container>
              </div>
            </div>
          </section>
        </div>
      </div>

    </div>

    <!-- Preço por Demanda -->
    <div class="price-selector-mode" *ngIf="formGroup.get('tipo')?.value === 'DEMANDA' && formGroup.get('faixas')">
      <div class="price-selector-mode__content">
        <section class="price-selector-section metro-price-group">
          <div class="metro-price-group__title">Faixas de preço</div>
          <div [formGroup]="formGroup">
            <div formArrayName="faixas">
              <div *ngFor="let grupo of faixas.controls; let i = index" [formGroupName]="i" class="price-range-row">
                <div class="price-demand-grid">
                  <div class="metro-price-control">
                    <app-input-numerico [control]="getControlDoGrupo(grupo, 'de')" label="De" placeholder="De" />
                  </div>
                  <div class="metro-price-control">
                    <app-input-numerico [control]="getControlDoGrupo(grupo, 'ate')" label="Até" placeholder="Até" />
                  </div>
                  <div class="metro-price-control price-range-control-with-action">
                    <div class="price-range-control-with-action__input">
                      <app-input-moeda [control]="getControlDoGrupo(grupo, 'valorUnitario')" label="Valor Unitário"
                        placeholder="Valor Unitário" />
                    </div>
                    <button type="button" mat-icon-button color="warn" *ngIf="faixas.length > 1" (click)="removerFaixa(i)"
                      matTooltip="Remover faixa">
                      <mat-icon>delete</mat-icon>
                    </button>
                  </div>
                </div>

                <div *ngIf="i < faixas.length - 1" class="price-range-divider"></div>
              </div>
            </div>
          </div>

          <button type="button" mat-stroked-button color="primary" class="price-range-add"
            (click)="adicionarFaixaPorTipo()">
            <mat-icon>add</mat-icon>
            <span>Adicionar Faixa</span>
          </button>
        </section>
      </div>
    </div>

    <!-- Preço por Hora -->
    <div class="price-selector-mode" *ngIf="formGroup.get('tipo')?.value === 'HORA'">
      <div class="price-selector-mode__content">
        <div class="metro-price-grid metro-price-grid--single">
          <section class="price-selector-section metro-price-group">
            <div class="metro-price-group__title">Valores</div>
            <div class="metro-price-group__grid">
              <div class="metro-price-control">
                <app-input-moeda [control]="getControl('valorHora')" label="Valor Hora" placeholder="Ex: R$ 50,00" />
              </div>
              <div class="metro-price-control">
                <app-input-numerico [control]="getControl('tempoEstimado')" label="Tempo Estimado (minutos)"
                  placeholder="Ex: 30" />
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>
</div>

<div class="status-grid-stack">
  <app-section-card
    class="status-grid-card status-grid-card--pedidos"
    title="Etapas dos pedidos"
    subtitle="Pedidos por status"
    [divider]="true">
    @if (erro) {
      <div class="status-grid-feedback" role="alert">
        <span>{{ erro }}</span>
        <button type="button" (click)="carregarStatus()">Tentar novamente</button>
      </div>
    } @else if (loading) {
      <div class="status-grid-feedback status-grid-feedback--neutral" role="status">Carregando status...</div>
    } @else if (refreshing) {
      <div class="status-grid-feedback status-grid-feedback--neutral" role="status">Atualizando status...</div>
    }

    <div class="status-grid" [class.status-grid--loading]="loading || refreshing">
      @for (item of pedidoStats; track item.status) {
        <ng-container *ngTemplateOutlet="statusIndicator; context: { $implicit: item }"></ng-container>
      }
    </div>
  </app-section-card>

  <app-section-card
    class="status-grid-card"
    title="Status dos orçamentos"
    subtitle="Orçamentos por status"
    [divider]="true">
    <div class="status-grid" [class.status-grid--loading]="loading || refreshing">
      @for (item of orcamentoStats; track item.status) {
        <ng-container *ngTemplateOutlet="statusIndicator; context: { $implicit: item }"></ng-container>
      }
    </div>
  </app-section-card>
</div>

<ng-template #statusIndicator let-item>
  <button
    type="button"
    class="status-grid__item status-grid__item--{{ item.tone }}"
    (click)="abrirStatus(item)">
    @if (compactMobile) {
      <span class="status-grid__label">{{ item.label }}</span>
    }
    <strong class="status-grid__value">{{ item.quantidade }}</strong>
    @if (!compactMobile) {
      <span class="status-grid__label">{{ item.label }}</span>
    }
    <small class="status-grid__amount">{{ formatBRL(item.valor) }}</small>
  </button>
</ng-template>

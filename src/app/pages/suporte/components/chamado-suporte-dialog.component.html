@if (mobilePanel) {
  <header class="mobile-side-panel__header">
    <h2>Novo chamado</h2>
    <button mat-icon-button type="button" aria-label="Fechar novo chamado" (click)="cancelar()" [disabled]="salvando"><mat-icon>close</mat-icon></button>
  </header>
} @else {
<h2 mat-dialog-title class="dialog-head">
  <span class="dialog-head__copy">
    <strong>Novo chamado</strong>
    <span>Envie sua dúvida ou problema para o suporte do sistema.</span>
  </span>
</h2>
}

<mat-dialog-content class="dialog-content" [class.mobile-side-panel__body]="mobilePanel">
  <form id="novo-chamado-form" [formGroup]="form" class="dialog-form" (ngSubmit)="salvar()">
    <app-input-texto-restrito
      label="Assunto"
      placeholder="Ex.: Dúvida sobre meu pedido"
      [maxlength]="160"
      [control]="assuntoControl"
      requiredError="Informe o assunto do chamado.">
    </app-input-texto-restrito>

    <div class="grid-two">
      <app-input-options
        label="Categoria"
        [control]="categoriaControl"
        [options]="categorias"
        labelKey="label"
        valueKey="value"
        [showNull]="false">
      </app-input-options>

      <app-input-options
        label="Prioridade"
        [control]="prioridadeControl"
        [options]="prioridades"
        labelKey="label"
        valueKey="value"
        [showNull]="false">
      </app-input-options>
    </div>

    <app-input-textarea
      label="Mensagem inicial"
      placeholder="Descreva o que aconteceu"
      [rows]="6"
      [maxlength]="3000"
      [control]="mensagemControl">
    </app-input-textarea>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions" [class.mobile-side-panel__footer]="mobilePanel">
  <button mat-stroked-button color="primary" type="button" (click)="cancelar()" [disabled]="salvando">
    Cancelar
  </button>
  <button mat-flat-button color="primary" type="submit" form="novo-chamado-form" [disabled]="salvando">
    {{ salvando ? 'Abrindo...' : 'Abrir chamado' }}
  </button>
</mat-dialog-actions>

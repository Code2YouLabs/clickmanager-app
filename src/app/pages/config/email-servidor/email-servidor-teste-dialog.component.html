<h2 mat-dialog-title class="dialog-title">Enviar e-mail de teste</h2>

<mat-dialog-content class="dialog-content">
  <form id="email-servidor-teste-form" [formGroup]="form" (ngSubmit)="enviar()" class="teste-form">
    <app-input-email
      [control]="emailControl"
      label="Destinatário"
      placeholder="email@exemplo.com">
    </app-input-email>

    <app-input-textarea
      [control]="mensagemControl"
      label="Mensagem"
      [rows]="4"
      [maxlength]="500">
    </app-input-textarea>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
  <button mat-stroked-button color="warn" type="button" (click)="cancelar()">Cancelar</button>
  <button mat-flat-button color="primary" type="submit" form="email-servidor-teste-form" [disabled]="form.invalid">
    Enviar
  </button>
</mat-dialog-actions>

<app-section-card
  *temPermissao="'SITE_PAGINA_BLOCOS_VER'"
  titulo="Conteúdo da página"
  subtitulo="Gerencie os blocos exibidos nesta página personalizada.">
  <app-data-table
    [columns]="colunas"
    [data]="blocos"
    [actions]="acoes"
    actionsMode="buttons"
    tableLabel="Blocos da página"
    [search]="{ enabled: false }"
    [loading]="carregando && !blocos.length"
    [refreshing]="carregando && !!blocos.length"
    [error]="erro"
    [forbidden]="semPermissao"
    [emptyState]="{
      title: 'Nenhum conteúdo cadastrado nesta página',
      description: 'Adicione blocos para compor a página personalizada.'
    }"
    (retry)="carregarBlocos()"
    (action)="onAcao($event)">
    <div data-table-toolbar-actions>
      <button mat-flat-button color="primary" type="button" (click)="adicionar()" *temPermissao="'SITE_PAGINA_BLOCOS_CADASTRAR'">
        <mat-icon>add</mat-icon>
        Adicionar bloco
      </button>
    </div>

    <ng-template appDataTableCell="ordem" let-bloco>
      {{ bloco.ordem || '-' }}
    </ng-template>

    <ng-template appDataTableCell="preview" let-bloco>
      <app-bloco-preview [bloco]="bloco"></app-bloco-preview>
    </ng-template>

    <ng-template appDataTableCell="status" let-bloco>
      <app-status-badge [status]="statusKey(bloco.ativo)" [compact]="true"></app-status-badge>
    </ng-template>

    <ng-template [appDataTableItem]="blocos" let-bloco let-actions="actions" let-emitAction="emitAction">
      <article class="bloco-mobile-card">
        <div class="bloco-mobile-card__head">
          <app-bloco-preview [bloco]="bloco"></app-bloco-preview>

          <button
            mat-icon-button
            type="button"
            [matMenuTriggerFor]="blocoMobileMenu"
            [matMenuTriggerData]="{ bloco: bloco, actions: actions, emitAction: emitAction }"
            [disabled]="!actions.length"
            aria-label="Abrir ações do bloco">
            <mat-icon>more_vert</mat-icon>
          </button>
        </div>

        <div class="bloco-mobile-card__footer">
          <span class="bloco-pill">Ordem {{ bloco.ordem || '-' }}</span>
          <app-status-badge [status]="statusKey(bloco.ativo)" [compact]="true"></app-status-badge>
        </div>
      </article>
    </ng-template>
  </app-data-table>
</app-section-card>

<mat-menu #blocoMobileMenu="matMenu">
  <ng-template matMenuContent let-bloco="bloco" let-actions="actions" let-emitAction="emitAction">
    @for (action of actions; track action.id) {
      <button mat-menu-item type="button" [disabled]="action.disabled?.(bloco)" (click)="emitAction(bloco, action.id)">
        @if (action.icon) {
          <mat-icon [color]="action.color || null">{{ action.icon }}</mat-icon>
        }
        <span>{{ action.label }}</span>
      </button>
    }
  </ng-template>
</mat-menu>

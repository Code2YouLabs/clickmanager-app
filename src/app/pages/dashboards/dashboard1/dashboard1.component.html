<app-page-card
  class="dashboard-page"
  titulo="Dashboard"
  subtitulo="Acompanhe receita, atendimento e operação da gráfica.">
  <div page-header-actions class="dashboard-actions">
    <button mat-stroked-button type="button" (click)="carregarResumo()" [disabled]="loading">
      Atualizar
    </button>
    <button mat-flat-button color="primary" type="button" (click)="navegar('/page/grafica/comercial-beta/pedidos/novo')">
      Novo pedido
    </button>
  </div>

  @if (erro) {
    <div class="dashboard-feedback" role="alert">
      {{ erro }}
    </div>
  }

  <section class="dashboard-kpis" [class.dashboard-kpis--loading]="loading">
    @for (card of summaryCards; track card.key) {
      <button type="button" class="dashboard-kpi-button" (click)="abrirResumo(card)">
        <app-metric-card
          [label]="card.label"
          [value]="card.value"
          [detail]="card.amount || periodoReceita"
          [icon]="card.icon"
          [accent]="card.accent || 'neutral'"
          [disabled]="loading">
        </app-metric-card>
      </button>
    }
  </section>

  <section class="dashboard-main-grid">
    <app-section-card
      class="dashboard-chart-section"
      title="Evolução comercial"
      subtitle="Compare pedidos e receita por período."
      [divider]="true">
      <app-comparativo-pedidos></app-comparativo-pedidos>
    </app-section-card>

    <app-section-card
      class="dashboard-quick-section"
      title="Atalhos"
      subtitle="Ações frequentes da operação."
      [divider]="true">
      <div class="quick-actions">
        @for (action of quickActions; track action.route) {
          <button type="button" class="quick-action" (click)="navegar(action.route)">
            <span class="quick-action__icon">
              <mat-icon>{{ action.icon }}</mat-icon>
            </span>
            <span class="quick-action__copy">
              <strong>{{ action.label }}</strong>
              <small>{{ action.description }}</small>
            </span>
          </button>
        }
      </div>
    </app-section-card>
  </section>

  <section class="dashboard-secondary-grid">
    <app-status-grid></app-status-grid>
    <app-receita-resumo></app-receita-resumo>
  </section>
</app-page-card>

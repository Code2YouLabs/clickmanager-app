<div class="cliente-dialog-shell" [appTutorialTarget]="data?.tutorialTarget || ''">
  <div mat-dialog-title class="dialog-head">
    <span class="dialog-head__copy">
      <strong>Novo cliente</strong>
      <span>Cadastre os dados essenciais para vincular ao pedido.</span>
    </span>
    <button mat-icon-button type="button" aria-label="Fechar" (click)="cancelar()" [disabled]="salvando">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-divider></mat-divider>

  <mat-dialog-content class="dialog-content">
    <form id="novo-cliente-dialog-form" [formGroup]="form" class="cliente-dialog-form" (ngSubmit)="salvar()">
      <section class="cliente-dialog-section" aria-labelledby="novo-cliente-dados-basicos">
        <header class="cliente-dialog-section__header">
          <strong id="novo-cliente-dados-basicos">Dados básicos</strong>
          <span>Nome, contato e documento do cliente.</span>
        </header>

        <div class="cliente-dialog-grid">
          <app-input-texto-restrito
            [control]="nomeControl"
            label="Nome"
            placeholder="Digite o nome do cliente"
            autocomplete="name"
            requiredError="Nome obrigatório">
          </app-input-texto-restrito>

          <app-input-telefone
            [control]="telefoneControl"
            label="Telefone"
            placeholder="Digite o telefone do cliente">
          </app-input-telefone>

          <app-input-email
            [control]="emailControl"
            label="E-mail"
            placeholder="Digite o e-mail">
          </app-input-email>

          <app-input-documento
            [control]="documentoControl"
            label="CPF ou CNPJ"
            placeholder="Opcional">
          </app-input-documento>
        </div>
      </section>

      <section class="cliente-dialog-section" aria-labelledby="novo-cliente-endereco">
        <header class="cliente-dialog-section__header">
          <strong id="novo-cliente-endereco">Endereço</strong>
          <span>Dados opcionais para entrega ou cadastro.</span>
        </header>

        <div class="cliente-dialog-grid cliente-dialog-grid--address">
          <app-input-cep
            class="cliente-dialog-cep"
            [control]="cepControl"
            label="CEP"
            placeholder="00000-000"
            [autoBuscar]="false"
            [showSearchButton]="true"
            searchButtonText="Buscar endereço"
            (enderecoEncontrado)="onEnderecoEncontrado($event)">
          </app-input-cep>

          <app-input-texto-restrito
            class="cliente-dialog-grid__wide"
            [control]="logradouroControl"
            label="Logradouro"
            placeholder="Rua, avenida..."
            autocomplete="street-address">
          </app-input-texto-restrito>

          <app-input-texto-restrito
            [control]="numeroControl"
            label="Número"
            placeholder="Nº"
            inputmode="numeric">
          </app-input-texto-restrito>

          <app-input-texto-restrito
            [control]="bairroControl"
            label="Bairro"
            placeholder="Informe o bairro">
          </app-input-texto-restrito>

          <app-input-texto-restrito
            [control]="cidadeControl"
            label="Cidade"
            placeholder="Informe a cidade">
          </app-input-texto-restrito>

          <app-input-texto-restrito
            [control]="estadoControl"
            label="Estado"
            placeholder="UF"
            [maxlength]="2">
          </app-input-texto-restrito>

          <app-input-texto-restrito
            class="cliente-dialog-grid__wide"
            [control]="complementoControl"
            label="Complemento"
            placeholder="Apartamento, bloco, referência...">
          </app-input-texto-restrito>
        </div>
      </section>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="dialog-actions">
    <button mat-stroked-button color="primary" type="button" (click)="cancelar()" [disabled]="salvando">
      Cancelar
    </button>
    <button mat-flat-button color="primary" type="submit" form="novo-cliente-dialog-form" [disabled]="salvando">
      <mat-spinner *ngIf="salvando" diameter="18"></mat-spinner>
      <mat-icon *ngIf="!salvando">save</mat-icon>
      <span>{{ salvando ? 'Salvando...' : 'Salvar cliente' }}</span>
    </button>
  </mat-dialog-actions>
</div>

<div class="cliente-dialog-shell mobile-side-panel__layout" [class.cliente-dialog-shell--quick]="quickMobile" [appTutorialTarget]="data?.tutorialTarget || ''">
  <div mat-dialog-title class="dialog-head mobile-side-panel__header">
    <span class="dialog-head__copy">
      <strong>Novo cliente</strong>
      <span *ngIf="!quickMobile">Cadastre os dados essenciais para vincular ao pedido.</span>
    </span>
    <button mat-icon-button type="button" aria-label="Fechar" (click)="cancelar()" [disabled]="salvando">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-divider></mat-divider>

  <mat-dialog-content class="dialog-content mobile-side-panel__body">
    <app-cliente-create-form #createForm [initialValue]="data" [mobileMode]="data?.mobileMode || 'full'"
      (created)="concluir($event)" (cancelled)="cancelar()"></app-cliente-create-form>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="dialog-actions mobile-side-panel__footer">
    <button mat-stroked-button color="primary" type="button" (click)="cancelar()" [disabled]="salvando">
      Cancelar
    </button>
    <button mat-flat-button color="primary" type="submit" form="novo-cliente-dialog-form" [disabled]="salvando">
      <mat-spinner *ngIf="salvando" diameter="18"></mat-spinner>
      <mat-icon *ngIf="!salvando">save</mat-icon>
      <span>{{ salvando ? 'Salvando...' : 'Salvar cliente' }}</span>
    </button>
  </mat-dialog-actions>
</div>

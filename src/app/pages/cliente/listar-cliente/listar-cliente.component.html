<app-page-card titulo="Clientes" [botaoTexto]="isMobile ? undefined : 'Novo cliente'" botaoIcone="add"
  [primaryAction]="isMobile ? novaAcao : null" (primaryActionClick)="novoCliente()"
  [botaoRota]="['/page/cliente/criar']" permissao="CLIENTE_CADASTRAR">
  @if (isMobile) {
    <button page-mobile-header-actions mat-button type="button" (click)="voltar()"><mat-icon>arrow_back</mat-icon>Voltar</button>
  }
  <app-data-table [columns]="colunas" [data]="clientes" [actions]="acoes" actionsMode="buttons"
    tableLabel="Clientes" [search]="{ enabled: true, label: 'Buscar clientes', placeholder: 'Pesquisar clientes', debounceMs: 400, value: termoPesquisa }"
    [pagination]="{ pageIndex: pagina, pageSize: tamanhoPagina, totalItems: totalClientes }"
    [loading]="carregando && !clientes.length" [refreshing]="carregando && !!clientes.length"
    [error]="erro" [forbidden]="semPermissao" [filtered]="!!termoPesquisa"
    [emptyState]="{ title: 'Nenhum cliente cadastrado', filteredTitle: 'Nenhum cliente encontrado', filteredDescription: 'Altere a busca para encontrar outros clientes.' }"
    (searchChange)="onPesquisar($event)" (pageChange)="onPaginaAlterada($event)"
    (retry)="carregarClientes()" (action)="onAcao($event)">
    <ng-template appDataTableCell="telefone" let-cliente>
      <span [innerHTML]="cliente.telefone | telefone"></span>
    </ng-template>
    <ng-template [appDataTableItem]="clientes" let-cliente let-itemActions="actions" let-emit="emitAction">
      <article class="cliente-mobile-item" [attr.aria-label]="'Cliente ' + cliente.nome">
        <header><strong>{{ cliente.nome }}</strong></header>
        <dl>
          <div><dt>Telefone</dt><dd>{{ (cliente.telefone | telefone) || 'Não informado' }}</dd></div>
          <div><dt>E-mail</dt><dd>{{ cliente.email || 'Não informado' }}</dd></div>
        </dl>
        @if (itemActions.length) {
          <div class="cliente-mobile-item__actions">
            @for (itemAction of itemActions; track itemAction.id) {
              <button mat-stroked-button type="button" [color]="itemAction.color || null"
                [disabled]="carregando || itemAction.disabled?.(cliente)"
                [attr.aria-label]="itemAction.label" (click)="emit(cliente, itemAction.id)">
                <mat-icon>{{ itemAction.icon }}</mat-icon>{{ itemAction.label }}
              </button>
            }
          </div>
        }
      </article>
    </ng-template>
  </app-data-table>
</app-page-card>

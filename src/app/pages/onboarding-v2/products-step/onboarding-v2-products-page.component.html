<div class="blank-layout-container justify-content-center onboarding-page-layout">
  <div class="auth-wrapper onboarding-page-wrapper">
    <div class="w-100 rounded bg-white auth-card onboarding-page-card">
      <div class="auth-body onboarding-page">
        <app-onboarding-shell tituloFluxo="Configuração inicial" tituloEtapa="Monte seu catálogo"
          subtituloEtapa="Escolha produtos e serviços prontos. Você também poderá acessar a biblioteca depois."
          [passoAtual]="2" [totalPassos]="3" [progressoPercentual]="67" [showBack]="false" [showSkip]="false"
          primaryLabel="Continuar" [primaryDisabled]="carregando || importando || avancando"
          [primaryLoading]="avancando" primaryHint="Esta etapa é opcional. Adicione os itens selecionados antes de continuar."
          (principal)="submit()">
          @if (carregando) { <mat-spinner diameter="40" /> }
          @else { <app-biblioteca-produtos-selector (ocupado)="importando = $event" /> }
        </app-onboarding-shell>
      </div>
    </div>
  </div>
</div>

<app-page-card titulo="Usuários" botaoTexto="Novo Usuário" botaoIcone="add"
  [botaoRota]="['/page/usuarios/novo']" permissao="USUARIO_CADASTRAR">
  <app-data-table [columns]="colunas" [data]="usuarios" [actions]="acoes" actionsMode="buttons" tableLabel="Usuários"
    [filters]="filtros" [filterState]="{ ativo: filtroStatus }" [filtered]="filtroStatus !== null"
    [pagination]="{ pageIndex: pagina, pageSize: tamanhoPagina, totalItems: totalUsuarios }"
    [loading]="carregando && !usuarios.length" [refreshing]="carregando && !!usuarios.length"
    [error]="erro" [forbidden]="semPermissao"
    [emptyState]="{ title: 'Nenhum usuário cadastrado', filteredTitle: 'Nenhum usuário encontrado', filteredDescription: 'Altere o filtro de status.' }"
    (filterChange)="onFiltros($event)" (pageChange)="onPaginaAlterada($event)"
    (retry)="carregarUsuarios()" (action)="onAcao($event)">
    <ng-template appDataTableCell="foto" let-usuario>
      <img [src]="imagemUtil.montarUrlImagemPerfil(usuario.fotoPerfil)" (error)="usarImagemPadrao($event)"
        [alt]="'Foto de ' + usuario.nome" class="rounded-circle object-cover" width="40" height="40" />
    </ng-template>
    <ng-template appDataTableCell="status" let-usuario>
      <app-status-badge [status]="usuario.ativo ? 'ATIVO' : 'INATIVO'"></app-status-badge>
    </ng-template>
  </app-data-table>
</app-page-card>

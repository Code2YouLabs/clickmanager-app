<svg class="mobile-toast__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path [attr.d]="iconPath" /></svg>
<div class="mobile-toast__content" [attr.role]="urgent ? 'alert' : 'status'" aria-atomic="true">
  @if (title) { <strong>{{ title }}</strong> }
  @if (options.enableHtml) { <div [innerHTML]="message"></div> }
  @else { <div>{{ message }}</div> }
</div>
@if (options.closeButton) {
  <button type="button" class="mobile-toast__close" aria-label="Fechar notificação" (click)="$event.stopPropagation(); remove()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6" /></svg>
  </button>
}

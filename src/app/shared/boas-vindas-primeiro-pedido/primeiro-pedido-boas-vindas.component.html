<section class="primeiro-pedido-welcome" role="document">
  <div class="primeiro-pedido-welcome__icon" aria-hidden="true">
    <mat-icon>celebration</mat-icon>
  </div>

  <div class="primeiro-pedido-welcome__content">
    <h2 mat-dialog-title>Bem-vindo ao ClickManager</h2>
    <mat-dialog-content>
      <div class="primeiro-pedido-welcome__message">
        <p>Sua gráfica está pronta para começar.</p>
        <p>Vamos criar seu primeiro pedido e conhecer o fluxo na prática?</p>
      </div>

      @if (erroOferta) {
        <div class="primeiro-pedido-welcome__notice" role="status">
          {{ erroOferta }}
        </div>
      }

      @if (erroAcao) {
        <div class="primeiro-pedido-welcome__error" role="alert">
          {{ erroAcao }}
        </div>
      }
    </mat-dialog-content>

    <mat-dialog-actions>
      <button class="primeiro-pedido-welcome__primary" mat-flat-button color="primary" type="button" [disabled]="iniciando || ignorando" (click)="criarPrimeiroPedido()">
        @if (iniciando) {
          Preparando...
        } @else {
          Criar meu primeiro pedido
        }
      </button>
      <button class="primeiro-pedido-welcome__secondary" mat-button type="button" [disabled]="iniciando || ignorando" (click)="explorarSozinho()">
        @if (ignorando) {
          Salvando...
        } @else {
          Explorar sozinho
        }
      </button>
    </mat-dialog-actions>
  </div>
</section>
